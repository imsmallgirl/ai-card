# Moa backend: ai-card-92a13 / moa-web / asia-east1
# Deployment requires separate approval.
# Managed runtime ADC; no credential files or private keys.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 512
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDeas3CL9YNS61DCWnTt4nSPW9HBCy_9NA"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "ai-card-92a13.firebaseapp.com"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "ai-card-92a13"
    availability: [ BUILD, RUNTIME ]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:472299472641:web:15c104ea17cee4e01bbd00"
    availability: [ BUILD, RUNTIME ]
  - variable: FIREBASE_PROJECT_ID
    value: "ai-card-92a13"
    availability: [ RUNTIME ]
  - variable: NEXT_PUBLIC_FIRESTORE_SYNC_ENABLED
    value: "true"
    availability: [ BUILD, RUNTIME ]
  - variable: FIRESTORE_SYNC_ENABLED
    value: "true"
    availability: [ RUNTIME ]
  - variable: AI_PROVIDER
    value: "gemini"
    availability: [ RUNTIME ]
  - variable: GEMINI_MODEL
    value: "gemini-3.1-flash-lite"
    availability: [ RUNTIME ]
  - variable: AI_GENERATION_ENABLED
    value: "true"
    availability: [ RUNTIME ]
  - variable: AI_GENERATION_UNLIMITED
    value: "false"
    availability: [ RUNTIME ]
  - variable: AI_DAILY_LIMIT
    value: "3"
    availability: [ RUNTIME ]
  - variable: AI_GLOBAL_DAILY_ATTEMPTS
    value: "100"
    availability: [ RUNTIME ]
  - variable: AI_GLOBAL_DAILY_TOKEN_BUDGET
    value: "2000000"
    availability: [ RUNTIME ]
  - variable: AI_MAX_OUTPUT_TOKENS
    value: "8192"
    availability: [ RUNTIME ]
  - variable: AI_COOLDOWN_SECONDS
    value: "5"
    availability: [ RUNTIME ]
  - variable: AI_FAILURE_COOLDOWN_SECONDS
    value: "30"
    availability: [ RUNTIME ]
  - variable: ANALYTICS_ENABLED
    value: "false"
    availability: [ RUNTIME ]
  - variable: ANALYTICS_EXPORT_ENABLED
    value: "false"
    availability: [ RUNTIME ]
  - variable: NEXT_PUBLIC_ANALYTICS_ENABLED
    value: "false"
    availability: [ BUILD, RUNTIME ]
  - variable: PRIVACY_POLICY_CONFIRMED
    value: "false"
    availability: [ BUILD, RUNTIME ]
  - variable: SITE_URL
    value: https://moa-web--ai-card-92a13.asia-east1.hosted.app
    availability:
      - BUILD
      - RUNTIME


  # Secret version 1 is enabled; runtime account has secret-scoped Accessor.
  - variable: GEMINI_API_KEY
    secret: moa-gemini-api-key
    availability: [ RUNTIME ]

# AI activation requires a separately approved rollout.
# Set SITE_OPERATOR_NAME and SUPPORT_EMAIL before inviting testers.
# Keep PRIVACY_POLICY_CONFIRMED=false until the policy has been reviewed.

# Operator confirmed Enhanced Measurement and automatic history tracking OFF.
# Collection remains gated by visitor consent; push/rollout need approval.
# Before confirming, disable Enhanced Measurement (forms/search/history/outbound)
# and review Google Signals, user-provided data and linked tag destinations.


  - variable: NEXT_PUBLIC_GA4_ENABLED
    value: "true"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GA4_MANUAL_ONLY_CONFIRMED
    value: "true"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GA4_MEASUREMENT_ID
    value: "G-RG4PEMXJC9"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_ORIGIN
    value: "https://moa-web--ai-card-92a13.asia-east1.hosted.app"
    availability: [BUILD, RUNTIME]
