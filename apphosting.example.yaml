# TEMPLATE ONLY. Replace placeholders, then copy to apphosting.yaml if App Hosting is selected.
# Creating an App Hosting backend requires billing; this file does not deploy anything.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: YOUR_PUBLIC_FIREBASE_WEB_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: YOUR_PROJECT_ID.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: YOUR_PROJECT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: YOUR_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: YOUR_PROJECT_ID
  - variable: SITE_URL
    value: https://YOUR_DOMAIN
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIRESTORE_SYNC_ENABLED
    value: "true"
    availability: [BUILD, RUNTIME]
  - variable: FIRESTORE_SYNC_ENABLED
    value: "true"
  - variable: AI_PROVIDER
    value: gemini
  - variable: GEMINI_MODEL
    value: gemini-3.1-flash-lite
  - variable: AI_GENERATION_ENABLED
    value: "false" # enable after reviewing actual quotas/billing
  - variable: AI_GENERATION_UNLIMITED
    value: "false"
  - variable: AI_DAILY_LIMIT
    value: "3"
  - variable: AI_GLOBAL_DAILY_ATTEMPTS
    value: "100"
  - variable: AI_GLOBAL_DAILY_TOKEN_BUDGET
    value: "2000000"
  - variable: AI_MAX_OUTPUT_TOKENS
    value: "8192"
  - variable: NEXT_PUBLIC_ANALYTICS_ENABLED
    value: "false"
  - variable: ANALYTICS_ENABLED
    value: "false"
  - variable: ANALYTICS_EXPORT_ENABLED
    value: "false"
  - variable: SITE_OPERATOR_NAME
    value: YOUR_OPERATOR_NAME
    availability: [BUILD, RUNTIME]
  - variable: SUPPORT_EMAIL
    value: YOUR_SUPPORT_EMAIL
    availability: [BUILD, RUNTIME]
  - variable: PRIVACY_POLICY_CONFIRMED
    value: "false"
    availability: [BUILD, RUNTIME]
  # Create the secret in the selected backend manually; never put the value here.
  # - variable: GEMINI_API_KEY
  #   secret: moa-gemini-api-key
  #   availability: [RUNTIME]
